name: Build Salah Face APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # lets tagged builds attach the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests (countdown formatting, engine, prayer calculation)
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK (signed with the standard debug key, installable over adb)
        run: gradle --no-daemon assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SalahFace-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SalahFace-debug-apk
          path: SalahFace-debug.apk
      - name: Attach APK to the release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SalahFace-debug.apk
